name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and its development tools
        run: python -m pip install -e ".[dev]"
      - name: Studio script parses
        run: node --check myradio/web/app.js
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
